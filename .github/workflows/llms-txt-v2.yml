name: llms.txt v2 interoperability

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  reference-parser:
    name: ${{ matrix.builder }} / ${{ matrix.suffix-mode }} / ${{ matrix.base-mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        builder: [html, dirhtml]
        suffix-mode: [append, replace]
        base-mode: [relative, absolute]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: false

      - name: Check audit URL safety
        run: >-
          uv run --frozen --group interop
          python -m pytest ci/test_check_llms_txt_v2.py

      - name: Build and parse every llms.txt
        run: >-
          uv run --frozen --group interop
          python ci/check_llms_txt_v2.py
          --builder "${{ matrix.builder }}"
          --suffix-mode "${{ matrix.suffix-mode }}"
          --base-mode "${{ matrix.base-mode }}"
